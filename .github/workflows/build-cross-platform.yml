name: Build (Cross-Platform)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# No secrets required. Codesigning/Notarization are intentionally out of scope.

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libcurl4-openssl-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev \
            libgtk-3-dev xvfb

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update >/dev/null || true
          # Xcode toolchain and system frameworks are available on runners.
          # Ninja is optional but speeds up builds.
          brew list ninja >/dev/null 2>&1 || brew install ninja || true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DJUCE_FETCH_FROM_GIT=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DJUCE_FETCH_FROM_GIT=ON

      - name: Build VST3
        run: cmake --build build --config ${{ matrix.build_type }} --target CERN_VST3 --parallel

      - name: Build Standalone
        run: cmake --build build --config ${{ matrix.build_type }} --target CERNStandalone --parallel

      - name: Build Tests
        run: cmake --build build --config ${{ matrix.build_type }} --target CERNTests --parallel

      - name: Run Tests (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          # Some JUCE test binaries may require a display; xvfb provides a virtual one.
          xvfb-run -a ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }} || \
          xvfb-run -a ./build/Source/CERNTests || echo "Tests failed or unavailable in headless environment"

      - name: Run Tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }} || echo "Tests failed (see logs)"

      - name: Package artefacts (Unix)
        if: runner.os != 'Windows'
        run: |
          bash scripts/package-vst3.sh build ${{ matrix.build_type }} dist
          bash scripts/package-standalone.sh build ${{ matrix.build_type }} dist

      - name: Package artefacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = '${{ matrix.build_type }}'
          $dist = "dist/windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $vst3 = "build/Source/CERN_artefacts/$config/VST3/C.E.R.N.vst3"
          $standalone = "build/Source/CERNStandalone_artefacts/$config/Standalone/C.E.R.N Standalone.exe"
          if (Test-Path $vst3) { Compress-Archive -Path $vst3 -DestinationPath "$dist/CERN-vst3-windows-$config.zip" -Force }
          if (Test-Path $standalone) { Compress-Archive -Path $standalone -DestinationPath "$dist/CERN-standalone-windows-$config.zip" -Force }

      - name: Upload VST3 artefact
        uses: actions/upload-artifact@v4
        with:
          name: CERN-vst3-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            dist/**/CERN-vst3-*
            build/Source/CERN_artefacts/${{ matrix.build_type }}/VST3/*.vst3
          if-no-files-found: warn

      - name: Upload Standalone artefact
        uses: actions/upload-artifact@v4
        with:
          name: CERN-standalone-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            dist/**/CERN-standalone-*
            build/Source/CERNStandalone_artefacts/${{ matrix.build_type }}/Standalone/*
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
